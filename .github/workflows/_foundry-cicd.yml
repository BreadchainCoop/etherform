# All-in-one Foundry CI/CD reusable workflow
# Usage: jobs.<job>.uses: BreadchainCoop/etherform/.github/workflows/_foundry-cicd.yml@main
name: Foundry CI/CD

on:
  workflow_call:
    inputs:
      # Change Detection Options
      skip-if-no-changes:
        description: 'Skip workflow if no smart contract files changed'
        type: boolean
        default: true
      contract-paths:
        description: 'Paths to check for changes (newline-separated glob patterns)'
        type: string
        default: |
          src/**
          script/**
          test/**
          lib/**
          foundry.toml
          remappings.txt

      # CI Options
      check-formatting:
        description: 'Run forge fmt --check'
        type: boolean
        default: true
      test-verbosity:
        description: 'Test verbosity level (v, vv, vvv, vvvv)'
        type: string
        default: 'vvv'

      # Slither Options
      run-slither:
        description: 'Run Slither static analysis'
        type: boolean
        default: false
      slither-fail-on:
        description: 'Minimum severity to fail on (low, medium, high)'
        type: string
        default: 'high'
      slither-config:
        description: 'Path to slither.config.json'
        type: string
        default: 'slither.config.json'

      # Coverage Options
      run-coverage:
        description: 'Run forge coverage and post PR comment'
        type: boolean
        default: false
      coverage-exclude-paths:
        description: 'Path pattern to exclude from coverage (--no-match-path)'
        type: string
        default: ''
      coverage-source-filter:
        description: 'Grep filter for source files in coverage report'
        type: string
        default: ' src/'
      coverage-post-comment:
        description: 'Post coverage summary as a sticky PR comment'
        type: boolean
        default: true

      # Upgrade Safety Options
      run-upgrade-safety:
        description: 'Run upgrade safety validation'
        type: boolean
        default: true
      baseline-path:
        description: 'Path to baseline contracts for upgrade comparison'
        type: string
        default: 'test/upgrades/baseline'
      validation-script:
        description: 'Path to upgrade validation script'
        type: string
        default: 'script/upgrades/ValidateUpgrade.s.sol'

      # Deploy Options
      deploy-on-pr:
        description: 'Deploy to testnet on pull request'
        type: boolean
        default: false
      deploy-on-main:
        description: 'Deploy to mainnet on push to main'
        type: boolean
        default: false
      deploy-script:
        description: 'Path to deployment script'
        type: string
        default: 'script/Deploy.s.sol:Deploy'
      network-config-path:
        description: 'Path to network configuration JSON'
        type: string
        default: '.github/deploy-networks.json'
      indexing-wait:
        description: 'Seconds to wait for indexer before verification'
        type: number
        default: 60
      verify-contracts:
        description: 'Verify deployed contracts on Blockscout'
        type: boolean
        default: true
      flatten-contracts:
        description: 'Flatten and commit contract snapshots after mainnet deploy'
        type: boolean
        default: true
      upgrades-path:
        description: 'Path for flattened contract snapshots'
        type: string
        default: 'test/upgrades'

    secrets:
      PRIVATE_KEY:
        description: 'Deployer wallet private key'
        required: false
      RPC_URL:
        description: 'Network RPC endpoint'
        required: false
      GH_TOKEN:
        description: 'GitHub token for pushing commits'
        required: false

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      contracts-changed: ${{ steps.filter.outputs.contracts }}
      should-run: ${{ steps.decide.outputs.should-run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build paths filter
        id: paths
        run: |
          # Convert newline-separated paths to YAML list format
          YAML_PATHS=$(echo "${{ inputs.contract-paths }}" | sed '/^$/d' | sed 's/^/    - /')
          echo "filter<<EOF" >> $GITHUB_OUTPUT
          echo "contracts:" >> $GITHUB_OUTPUT
          echo "$YAML_PATHS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check for contract changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: ${{ steps.paths.outputs.filter }}

      - name: Decide whether to run
        id: decide
        run: |
          if [[ "${{ inputs.skip-if-no-changes }}" == "false" ]]; then
            echo "Change detection disabled, workflow will run"
            echo "should-run=true" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.filter.outputs.contracts }}" == "true" ]]; then
            echo "Contract changes detected, workflow will run"
            echo "should-run=true" >> $GITHUB_OUTPUT
          else
            echo "No contract changes detected, skipping workflow"
            echo "should-run=false" >> $GITHUB_OUTPUT
          fi

  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.should-run == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Check formatting
        if: inputs.check-formatting
        run: forge fmt --check

      - name: Build contracts
        run: forge build

      - name: Run tests
        run: forge test -${{ inputs.test-verbosity }}

  slither:
    name: Slither Analysis
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      needs.detect-changes.outputs.should-run == 'true' &&
      inputs.run-slither
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build for Slither
        run: forge build --build-info --skip '*/test/**' '*/script/**' --force

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          slither-config: ${{ inputs.slither-config }}
          fail-on: ${{ inputs.slither-fail-on }}

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [detect-changes, ci]
    if: |
      always() &&
      needs.detect-changes.outputs.should-run == 'true' &&
      needs.ci.result == 'success' &&
      inputs.run-coverage
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run coverage
        run: |
          if [[ -n "${{ inputs.coverage-exclude-paths }}" ]]; then
            forge coverage --no-match-path "${{ inputs.coverage-exclude-paths }}" 2>&1 | tee coverage-raw.txt
          else
            forge coverage 2>&1 | tee coverage-raw.txt
          fi

      - name: Extract summary table
        run: |
          # Extract the final summary table (box-drawing characters)
          awk '/^╭/,/^╰/' coverage-raw.txt > coverage-table.txt

          # Filter to only source files and compute totals from raw counts
          grep '^|' coverage-table.txt | grep '${{ inputs.coverage-source-filter }}' > src-rows.txt || true

          # Sum up hit/total for each metric across source files
          total_lines_hit=0; total_lines_all=0
          total_stmts_hit=0; total_stmts_all=0
          total_branch_hit=0; total_branch_all=0
          total_funcs_hit=0; total_funcs_all=0

          while IFS='|' read -r _ file lines stmts branches funcs _; do
            extract() { echo "$1" | grep -oP '\(\K[0-9]+/[0-9]+' | tr '/' ' '; }
            read lh lt <<< "$(extract "$lines")"
            read sh st <<< "$(extract "$stmts")"
            read bh bt <<< "$(extract "$branches")"
            read fh ft <<< "$(extract "$funcs")"
            total_lines_hit=$((total_lines_hit + lh)); total_lines_all=$((total_lines_all + lt))
            total_stmts_hit=$((total_stmts_hit + sh)); total_stmts_all=$((total_stmts_all + st))
            total_branch_hit=$((total_branch_hit + bh)); total_branch_all=$((total_branch_all + bt))
            total_funcs_hit=$((total_funcs_hit + fh)); total_funcs_all=$((total_funcs_all + ft))
          done < src-rows.txt

          pct() { [ "$2" -eq 0 ] && echo "100.00% (0/0)" || printf "%.2f%% (%d/%d)" "$(echo "scale=4; $1 * 100 / $2" | bc)" "$1" "$2"; }

          # Build the markdown comment
          {
            echo "## Coverage Report"
            echo ""
            echo "| Metric | Coverage |"
            echo "|--------|----------|"
            echo "| Lines | $(pct $total_lines_hit $total_lines_all) |"
            echo "| Statements | $(pct $total_stmts_hit $total_stmts_all) |"
            echo "| Branches | $(pct $total_branch_hit $total_branch_all) |"
            echo "| Functions | $(pct $total_funcs_hit $total_funcs_all) |"
            echo ""
            echo "<details><summary>Coverage by file</summary>"
            echo ""
            echo "| File | Lines | Statements | Branches | Functions |"
            echo "|------|-------|------------|----------|-----------|"
            while IFS='|' read -r _ file lines stmts branches funcs _; do
              file=$(echo "$file" | xargs)
              lines=$(echo "$lines" | xargs)
              stmts=$(echo "$stmts" | xargs)
              branches=$(echo "$branches" | xargs)
              funcs=$(echo "$funcs" | xargs)
              echo "| \`$file\` | $lines | $stmts | $branches | $funcs |"
            done < src-rows.txt
            echo ""
            echo "</details>"
          } > coverage-comment.md

      - name: Post coverage comment
        if: inputs.coverage-post-comment && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: coverage-comment.md

  upgrade-safety:
    name: Upgrade Safety
    runs-on: ubuntu-latest
    needs: [detect-changes, ci]
    if: |
      needs.detect-changes.outputs.should-run == 'true' &&
      inputs.run-upgrade-safety
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run upgrade safety validation
        run: |
          forge clean && forge build

          BASELINE="${{ inputs.baseline-path }}"
          FALLBACK="${{ inputs.baseline-path }}/../previous"

          if [ -d "$BASELINE" ] && ls ${BASELINE}/*.sol 1> /dev/null 2>&1; then
            echo "Baseline contracts found in $BASELINE, running upgrade validation..."
            forge script ${{ inputs.validation-script }} -vvv
          elif [ -d "$FALLBACK" ] && ls ${FALLBACK}/*.sol 1> /dev/null 2>&1; then
            echo "Baseline contracts found in $FALLBACK (fallback path), running upgrade validation..."
            forge script ${{ inputs.validation-script }} -vvv
          else
            echo "::warning::Baseline missing — will auto-init on first merge to main"
            echo "No baseline contracts found, skipping upgrade validation (initial deployment)"
          fi

  deploy-testnet:
    name: Deploy Testnet
    runs-on: ubuntu-latest
    needs: [detect-changes, ci, upgrade-safety]
    if: |
      always() &&
      needs.detect-changes.outputs.should-run == 'true' &&
      needs.ci.result == 'success' &&
      (needs.upgrade-safety.result == 'success' || needs.upgrade-safety.result == 'skipped') &&
      inputs.deploy-on-pr &&
      github.event_name == 'pull_request'
    outputs:
      network_name: ${{ steps.network.outputs.network_name }}
      blockscout_url: ${{ steps.network.outputs.blockscout_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Deploy contracts
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          RPC_URL: ${{ secrets.RPC_URL }}
        run: |
          if [[ "$PRIVATE_KEY" != 0x* ]]; then
            export PRIVATE_KEY="0x$PRIVATE_KEY"
          fi
          forge script ${{ inputs.deploy-script }} \
            --rpc-url "$RPC_URL" \
            --broadcast \
            --slow \
            -vvvv

      - name: Parse deployment addresses
        id: parse
        run: |
          BROADCAST_FILE=$(find broadcast -name "run-latest.json" -type f | head -1)
          if [[ -z "$BROADCAST_FILE" ]]; then
            echo "No broadcast file found"
            exit 1
          fi
          echo "broadcast_file=$BROADCAST_FILE" >> $GITHUB_OUTPUT

          # Extract the chain ID from the broadcast file path (broadcast/<script>/<chain_id>/run-latest.json)
          CHAIN_ID=$(echo "$BROADCAST_FILE" | sed -E 's|.*/([0-9]+)/run-latest\.json$|\1|')
          echo "chain_id=$CHAIN_ID" >> $GITHUB_OUTPUT
          echo "Deployed to chain ID: $CHAIN_ID"

          jq -r '.transactions[] | select(.transactionType == "CREATE") | "\(.contractName): \(.contractAddress)"' "$BROADCAST_FILE" | tee deployment-summary.txt

      - name: Resolve Blockscout URL from chain ID
        id: network
        run: |
          CHAIN_ID="${{ steps.parse.outputs.chain_id }}"
          CONFIG="${{ inputs.network-config-path }}"

          # Search both testnets and mainnets arrays for a matching chain_id
          BLOCKSCOUT_URL=$(jq -r --argjson cid "$CHAIN_ID" '
            (.testnets // []) + (.mainnets // [])
            | map(select(.chain_id == $cid))
            | first
            | .blockscout_url // empty
          ' "$CONFIG" 2>/dev/null) || true

          if [[ -z "$BLOCKSCOUT_URL" || "$BLOCKSCOUT_URL" == "null" ]]; then
            echo "::warning::No Blockscout URL found for chain ID $CHAIN_ID in $CONFIG. Falling back to testnets[0]."
            BLOCKSCOUT_URL=$(jq -r '.testnets[0].blockscout_url' "$CONFIG")
          fi

          NETWORK_NAME=$(jq -r --argjson cid "$CHAIN_ID" '
            (.testnets // []) + (.mainnets // [])
            | map(select(.chain_id == $cid))
            | first
            | .name // "unknown"
          ' "$CONFIG" 2>/dev/null) || NETWORK_NAME="unknown"

          echo "blockscout_url=$BLOCKSCOUT_URL" >> $GITHUB_OUTPUT
          echo "network_name=$NETWORK_NAME" >> $GITHUB_OUTPUT
          echo "Resolved Blockscout URL for chain $CHAIN_ID: $BLOCKSCOUT_URL ($NETWORK_NAME)"

      - name: Create deployment summary
        env:
          BLOCKSCOUT_URL: ${{ steps.network.outputs.blockscout_url }}
          ETH_RPC_URL: ${{ secrets.RPC_URL }}
        run: |
          echo "## Testnet Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Contract | Address | Explorer |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|---------|----------|" >> $GITHUB_STEP_SUMMARY
          while read -r line; do
            CONTRACT=$(echo "$line" | cut -d: -f1)
            ADDRESS=$(echo "$line" | cut -d: -f2 | tr -d ' ')
            echo "| $CONTRACT | \`$ADDRESS\` | [View](${BLOCKSCOUT_URL}/address/$ADDRESS) |" >> $GITHUB_STEP_SUMMARY
          done < deployment-summary.txt

      - name: Upload broadcast for verification
        if: inputs.verify-contracts
        uses: actions/upload-artifact@v4
        with:
          name: broadcast-testnet-${{ steps.network.outputs.network_name }}
          path: broadcast/

  verify-testnet:
    name: Verify Testnet
    runs-on: ubuntu-latest
    needs: [detect-changes, ci, upgrade-safety, deploy-testnet]
    if: |
      always() &&
      needs.deploy-testnet.result == 'success' &&
      inputs.verify-contracts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Download broadcast artifact
        uses: actions/download-artifact@v4
        with:
          name: broadcast-testnet-${{ needs.deploy-testnet.outputs.network_name }}
          path: broadcast/

      - name: Build contracts
        run: forge build

      - name: Verify contracts on Blockscout
        env:
          BLOCKSCOUT_URL: ${{ needs.deploy-testnet.outputs.blockscout_url }}
          ETH_RPC_URL: ${{ secrets.RPC_URL }}
        run: |
          # Validate Blockscout URL format
          if [[ -z "$BLOCKSCOUT_URL" || "$BLOCKSCOUT_URL" == "null" ]]; then
            echo "::error::BLOCKSCOUT_URL is empty or not configured. Check deploy-networks.json."
            exit 1
          fi
          if [[ ! "$BLOCKSCOUT_URL" =~ ^https?:// ]]; then
            echo "::error::BLOCKSCOUT_URL has invalid format (got: '$BLOCKSCOUT_URL'). Must start with http:// or https://."
            exit 1
          fi

          BROADCAST_FILE=$(find broadcast -name "run-latest.json" -type f | head -1)
          if [[ -z "$BROADCAST_FILE" ]]; then
            echo "No broadcast file found"
            exit 1
          fi

          # Collect all CREATE contracts
          CONTRACTS=()
          while read -r tx; do
            name=$(echo "$tx" | jq -r '.contractName')
            addr=$(echo "$tx" | jq -r '.contractAddress')
            CONTRACTS+=("${name}:${addr}")
          done < <(jq -c '.transactions[] | select(.transactionType == "CREATE")' "$BROADCAST_FILE")

          echo "Found ${#CONTRACTS[@]} contracts to verify"

          # Phase 1: Submit all contracts for verification (no --watch)
          for entry in "${CONTRACTS[@]}"; do
            CONTRACT_NAME="${entry%%:*}"
            CONTRACT_ADDR="${entry#*:}"
            echo "Submitting $CONTRACT_NAME ($CONTRACT_ADDR) for verification..."
            SUBMIT_OUTPUT=$(forge verify-contract "$CONTRACT_ADDR" "$CONTRACT_NAME" \
              --verifier blockscout \
              --verifier-url "${BLOCKSCOUT_URL}/api" \
              --guess-constructor-args 2>&1) || true
            echo "$SUBMIT_OUTPUT"
            if echo "$SUBMIT_OUTPUT" | grep -qi "already verified"; then
              echo "  → already verified"
            fi
          done

          # Phase 2: Wait for Blockscout to process the verification queue
          echo "Waiting 60s for Blockscout to process submissions..."
          sleep 60

          # Phase 3: Check verification status via API, retry unverified contracts
          VERIFY_FAILED=0
          MAX_CHECKS=10
          CHECK_DELAY=30

          for entry in "${CONTRACTS[@]}"; do
            CONTRACT_NAME="${entry%%:*}"
            CONTRACT_ADDR="${entry#*:}"

            VERIFIED=0
            for check in $(seq 1 $MAX_CHECKS); do
              # Query Blockscout API for verification status
              API_RESULT=$(curl -sf "${BLOCKSCOUT_URL}/api?module=contract&action=getabi&address=${CONTRACT_ADDR}" 2>/dev/null) || true
              API_STATUS=$(echo "$API_RESULT" | jq -r '.status // "0"' 2>/dev/null) || API_STATUS="0"

              if [[ "$API_STATUS" == "1" ]]; then
                echo "✓ $CONTRACT_NAME ($CONTRACT_ADDR) verified"
                VERIFIED=1
                break
              fi

              if [[ $check -lt $MAX_CHECKS ]]; then
                echo "  $CONTRACT_NAME not yet verified (check $check/$MAX_CHECKS), resubmitting and waiting ${CHECK_DELAY}s..."
                # Resubmit to ensure it's in the queue
                forge verify-contract "$CONTRACT_ADDR" "$CONTRACT_NAME" \
                  --verifier blockscout \
                  --verifier-url "${BLOCKSCOUT_URL}/api" \
                  --guess-constructor-args 2>&1 || true
                sleep $CHECK_DELAY
              fi
            done

            if [[ $VERIFIED -eq 0 ]]; then
              echo "::error::Verification failed for $CONTRACT_NAME ($CONTRACT_ADDR) after $MAX_CHECKS checks"
              VERIFY_FAILED=1
            fi
          done

          if [[ $VERIFY_FAILED -eq 1 ]]; then
            echo "::error::One or more contracts failed verification"
            exit 1
          fi

          echo "All contracts verified successfully"

  deploy-mainnet:
    name: Deploy Mainnet
    runs-on: ubuntu-latest
    needs: [detect-changes, ci, upgrade-safety]
    if: |
      always() &&
      needs.detect-changes.outputs.should-run == 'true' &&
      needs.ci.result == 'success' &&
      (needs.upgrade-safety.result == 'success' || needs.upgrade-safety.result == 'skipped') &&
      inputs.deploy-on-main &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    outputs:
      network_name: ${{ steps.network.outputs.network_name }}
      blockscout_url: ${{ steps.network.outputs.blockscout_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Deploy contracts
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          RPC_URL: ${{ secrets.RPC_URL }}
        run: |
          if [[ "$PRIVATE_KEY" != 0x* ]]; then
            export PRIVATE_KEY="0x$PRIVATE_KEY"
          fi
          forge script ${{ inputs.deploy-script }} \
            --rpc-url "$RPC_URL" \
            --broadcast \
            --slow \
            -vvvv

      - name: Parse deployment addresses
        id: parse
        run: |
          BROADCAST_FILE=$(find broadcast -name "run-latest.json" -type f | head -1)
          if [[ -z "$BROADCAST_FILE" ]]; then
            echo "No broadcast file found"
            exit 1
          fi
          echo "broadcast_file=$BROADCAST_FILE" >> $GITHUB_OUTPUT

          # Extract the chain ID from the broadcast file path (broadcast/<script>/<chain_id>/run-latest.json)
          CHAIN_ID=$(echo "$BROADCAST_FILE" | sed -E 's|.*/([0-9]+)/run-latest\.json$|\1|')
          echo "chain_id=$CHAIN_ID" >> $GITHUB_OUTPUT
          echo "Deployed to chain ID: $CHAIN_ID"

          jq -r '.transactions[] | select(.transactionType == "CREATE") | "\(.contractName): \(.contractAddress)"' "$BROADCAST_FILE" | tee deployment-summary.txt

      - name: Resolve Blockscout URL from chain ID
        id: network
        run: |
          CHAIN_ID="${{ steps.parse.outputs.chain_id }}"
          CONFIG="${{ inputs.network-config-path }}"

          # Search both testnets and mainnets arrays for a matching chain_id
          BLOCKSCOUT_URL=$(jq -r --argjson cid "$CHAIN_ID" '
            (.testnets // []) + (.mainnets // [])
            | map(select(.chain_id == $cid))
            | first
            | .blockscout_url // empty
          ' "$CONFIG" 2>/dev/null) || true

          if [[ -z "$BLOCKSCOUT_URL" || "$BLOCKSCOUT_URL" == "null" ]]; then
            echo "::warning::No Blockscout URL found for chain ID $CHAIN_ID in $CONFIG. Falling back to mainnets[0]."
            BLOCKSCOUT_URL=$(jq -r '.mainnets[0].blockscout_url' "$CONFIG")
          fi

          NETWORK_NAME=$(jq -r --argjson cid "$CHAIN_ID" '
            (.testnets // []) + (.mainnets // [])
            | map(select(.chain_id == $cid))
            | first
            | .name // "unknown"
          ' "$CONFIG" 2>/dev/null) || NETWORK_NAME="unknown"

          ENVIRONMENT=$(jq -r --argjson cid "$CHAIN_ID" '
            (.testnets // []) + (.mainnets // [])
            | map(select(.chain_id == $cid))
            | first
            | .environment // "unknown"
          ' "$CONFIG" 2>/dev/null) || ENVIRONMENT="unknown"

          echo "blockscout_url=$BLOCKSCOUT_URL" >> $GITHUB_OUTPUT
          echo "network_name=$NETWORK_NAME" >> $GITHUB_OUTPUT
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "Resolved Blockscout URL for chain $CHAIN_ID: $BLOCKSCOUT_URL ($NETWORK_NAME)"

      - name: Create deployment summary
        env:
          BLOCKSCOUT_URL: ${{ steps.network.outputs.blockscout_url }}
          ETH_RPC_URL: ${{ secrets.RPC_URL }}
        run: |
          echo "## Mainnet Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Contract | Address | Explorer |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|---------|----------|" >> $GITHUB_STEP_SUMMARY
          while read -r line; do
            CONTRACT=$(echo "$line" | cut -d: -f1)
            ADDRESS=$(echo "$line" | cut -d: -f2 | tr -d ' ')
            echo "| $CONTRACT | \`$ADDRESS\` | [View](${BLOCKSCOUT_URL}/address/$ADDRESS) |" >> $GITHUB_STEP_SUMMARY
          done < deployment-summary.txt

      - name: Upload broadcast for verification
        if: inputs.verify-contracts
        uses: actions/upload-artifact@v4
        with:
          name: broadcast-mainnet-${{ steps.network.outputs.network_name }}
          path: broadcast/

  verify-mainnet:
    name: Verify Mainnet
    runs-on: ubuntu-latest
    needs: [detect-changes, ci, upgrade-safety, deploy-mainnet]
    if: |
      always() &&
      needs.deploy-mainnet.result == 'success' &&
      inputs.verify-contracts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Download broadcast artifact
        uses: actions/download-artifact@v4
        with:
          name: broadcast-mainnet-${{ needs.deploy-mainnet.outputs.network_name }}
          path: broadcast/

      - name: Build contracts
        run: forge build

      - name: Verify contracts on Blockscout
        env:
          BLOCKSCOUT_URL: ${{ needs.deploy-mainnet.outputs.blockscout_url }}
          ETH_RPC_URL: ${{ secrets.RPC_URL }}
        run: |
          # Validate Blockscout URL format
          if [[ -z "$BLOCKSCOUT_URL" || "$BLOCKSCOUT_URL" == "null" ]]; then
            echo "::error::BLOCKSCOUT_URL is empty or not configured. Check deploy-networks.json."
            exit 1
          fi
          if [[ ! "$BLOCKSCOUT_URL" =~ ^https?:// ]]; then
            echo "::error::BLOCKSCOUT_URL has invalid format (got: '$BLOCKSCOUT_URL'). Must start with http:// or https://."
            exit 1
          fi

          BROADCAST_FILE=$(find broadcast -name "run-latest.json" -type f | head -1)
          if [[ -z "$BROADCAST_FILE" ]]; then
            echo "No broadcast file found"
            exit 1
          fi

          # Collect all CREATE contracts
          CONTRACTS=()
          while read -r tx; do
            name=$(echo "$tx" | jq -r '.contractName')
            addr=$(echo "$tx" | jq -r '.contractAddress')
            CONTRACTS+=("${name}:${addr}")
          done < <(jq -c '.transactions[] | select(.transactionType == "CREATE")' "$BROADCAST_FILE")

          echo "Found ${#CONTRACTS[@]} contracts to verify"

          # Phase 1: Submit all contracts for verification (no --watch)
          for entry in "${CONTRACTS[@]}"; do
            CONTRACT_NAME="${entry%%:*}"
            CONTRACT_ADDR="${entry#*:}"
            echo "Submitting $CONTRACT_NAME ($CONTRACT_ADDR) for verification..."
            SUBMIT_OUTPUT=$(forge verify-contract "$CONTRACT_ADDR" "$CONTRACT_NAME" \
              --verifier blockscout \
              --verifier-url "${BLOCKSCOUT_URL}/api" \
              --guess-constructor-args 2>&1) || true
            echo "$SUBMIT_OUTPUT"
            if echo "$SUBMIT_OUTPUT" | grep -qi "already verified"; then
              echo "  → already verified"
            fi
          done

          # Phase 2: Wait for Blockscout to process the verification queue
          echo "Waiting 60s for Blockscout to process submissions..."
          sleep 60

          # Phase 3: Check verification status via API, retry unverified contracts
          VERIFY_FAILED=0
          MAX_CHECKS=10
          CHECK_DELAY=30

          for entry in "${CONTRACTS[@]}"; do
            CONTRACT_NAME="${entry%%:*}"
            CONTRACT_ADDR="${entry#*:}"

            VERIFIED=0
            for check in $(seq 1 $MAX_CHECKS); do
              # Query Blockscout API for verification status
              API_RESULT=$(curl -sf "${BLOCKSCOUT_URL}/api?module=contract&action=getabi&address=${CONTRACT_ADDR}" 2>/dev/null) || true
              API_STATUS=$(echo "$API_RESULT" | jq -r '.status // "0"' 2>/dev/null) || API_STATUS="0"

              if [[ "$API_STATUS" == "1" ]]; then
                echo "✓ $CONTRACT_NAME ($CONTRACT_ADDR) verified"
                VERIFIED=1
                break
              fi

              if [[ $check -lt $MAX_CHECKS ]]; then
                echo "  $CONTRACT_NAME not yet verified (check $check/$MAX_CHECKS), resubmitting and waiting ${CHECK_DELAY}s..."
                # Resubmit to ensure it's in the queue
                forge verify-contract "$CONTRACT_ADDR" "$CONTRACT_NAME" \
                  --verifier blockscout \
                  --verifier-url "${BLOCKSCOUT_URL}/api" \
                  --guess-constructor-args 2>&1 || true
                sleep $CHECK_DELAY
              fi
            done

            if [[ $VERIFIED -eq 0 ]]; then
              echo "::error::Verification failed for $CONTRACT_NAME ($CONTRACT_ADDR) after $MAX_CHECKS checks"
              VERIFY_FAILED=1
            fi
          done

          if [[ $VERIFY_FAILED -eq 1 ]]; then
            echo "::error::One or more contracts failed verification"
            exit 1
          fi

          echo "All contracts verified successfully"

  flatten-snapshots:
    name: Flatten Snapshots
    runs-on: ubuntu-latest
    needs: [deploy-mainnet]
    if: |
      always() &&
      needs.deploy-mainnet.result == 'success' &&
      inputs.flatten-contracts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build contracts
        run: forge build

      - name: Extract and flatten contracts
        env:
          UPGRADES_PATH: ${{ inputs.upgrades-path }}
        run: |
          mkdir -p "${UPGRADES_PATH}/current"

          CONTRACTS=$(find broadcast -name "run-latest.json" -type f -exec \
            jq -r '.transactions[] | select(.transactionType == "CREATE") | "src/\(.contractName).sol"' {} \; 2>/dev/null | sort -u)

          if [[ -z "$CONTRACTS" ]]; then
            CONTRACTS=$(find src -maxdepth 1 -type f -name "*.sol")
          fi

          echo "$CONTRACTS" | while read -r contract; do
            if [[ -f "$contract" ]]; then
              name=$(basename "$contract")
              echo "Flattening $contract..."
              forge flatten "$contract" > "${UPGRADES_PATH}/current/$name"
            fi
          done

      - name: Promote snapshots (3-tier rotation)
        env:
          UPGRADES_PATH: ${{ inputs.upgrades-path }}
        run: |
          if [[ -d "${UPGRADES_PATH}/baseline" ]] && ls ${UPGRADES_PATH}/baseline/*.sol 1> /dev/null 2>&1; then
            echo "Baseline exists, performing 3-tier rotation..."
            rm -rf "${UPGRADES_PATH}/previous"
            cp -r "${UPGRADES_PATH}/baseline" "${UPGRADES_PATH}/previous"
            rm -rf "${UPGRADES_PATH}/baseline"
            cp -r "${UPGRADES_PATH}/current" "${UPGRADES_PATH}/baseline"
            COMMIT_MSG="chore: auto-flatten contracts after deploy [skip ci]"
          else
            echo "No baseline found, initializing..."
            mkdir -p "${UPGRADES_PATH}/baseline"
            cp -r "${UPGRADES_PATH}/current/"* "${UPGRADES_PATH}/baseline/"
            COMMIT_MSG="chore: init upgrade baseline [skip ci]"
          fi
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_ENV

      - name: Commit flattened contracts
        env:
          UPGRADES_PATH: ${{ inputs.upgrades-path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${UPGRADES_PATH}/" || true
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "$commit_msg"
            git push
          fi
