# Reusable CI workflow for Foundry projects
# Usage: jobs.<job>.uses: ./.github/workflows/_ci.yml
name: CI (Reusable)

on:
  workflow_call:
    inputs:
      check-formatting:
        description: 'Run forge fmt --check'
        type: boolean
        default: true
      test-verbosity:
        description: 'Test verbosity level (v, vv, vvv, vvvv)'
        type: string
        default: 'vvv'
      run-slither:
        description: 'Run Slither static analysis'
        type: boolean
        default: false
      slither-fail-on:
        description: 'Minimum severity to fail on (low, medium, high)'
        type: string
        default: 'high'
      slither-config:
        description: 'Path to slither.config.json'
        type: string
        default: 'slither.config.json'

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Check formatting
        if: inputs.check-formatting
        run: forge fmt --check

      - name: Build contracts
        run: forge build

      - name: Run tests
        run: forge test -${{ inputs.test-verbosity }}

  slither:
    name: Slither Analysis
    runs-on: ubuntu-latest
    if: inputs.run-slither
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build for Slither
        run: forge build --build-info --skip '*/test/**' '*/script/**' --force

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          slither-config: ${{ inputs.slither-config }}
          fail-on: ${{ inputs.slither-fail-on }}
