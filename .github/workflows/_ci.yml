# Reusable CI workflow for Foundry projects
# Usage: jobs.<job>.uses: BreadchainCoop/etherform/.github/workflows/_ci.yml@main
name: CI (Reusable)

on:
  workflow_call:
    inputs:
      check-formatting:
        description: 'Run forge fmt --check'
        type: boolean
        default: true
      test-verbosity:
        description: 'Test verbosity level (v, vv, vvv, vvvv)'
        type: string
        default: 'vvv'
      package-manager:
        description: 'Package manager for Node.js dependencies (none, npm, yarn, pnpm)'
        type: string
        default: 'none'
      node-version:
        description: 'Node.js version for package installation'
        type: string
        default: '20'
      run-slither:
        description: 'Run Slither static analysis'
        type: boolean
        default: false
      slither-fail-on:
        description: 'Minimum severity to fail on (low, medium, high)'
        type: string
        default: 'high'
      slither-config:
        description: 'Path to slither.config.json'
        type: string
        default: 'slither.config.json'
      run-coverage:
        description: 'Run forge coverage and post PR comment'
        type: boolean
        default: false
      coverage-exclude-paths:
        description: 'Path pattern to exclude from coverage (--no-match-path)'
        type: string
        default: ''
      coverage-source-filter:
        description: 'Grep filter for source files in coverage report'
        type: string
        default: ' src/'
      coverage-post-comment:
        description: 'Post coverage summary as a sticky PR comment'
        type: boolean
        default: true
      coverage-min-threshold:
        description: 'Minimum coverage percentage to pass (0 = disabled)'
        type: number
        default: 0
      run-halmos:
        description: 'Run Halmos symbolic execution'
        type: boolean
        default: false
      etherform-ref:
        description: 'Git ref for etherform scripts checkout (default: main)'
        type: string
        default: 'main'
      foundry-version:
        description: 'Foundry release channel or tag (e.g. stable, nightly, v1.0.0)'
        type: string
        default: 'stable'
    secrets:
      RPC_URL:
        description: 'RPC endpoint for fork-based tests'
        required: false

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ inputs.foundry-version }}

      - name: Setup Node.js
        if: inputs.package-manager != 'none'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        if: inputs.package-manager != 'none'
        run: |
          case "${{ inputs.package-manager }}" in
            npm)  npm ci ;;
            yarn) yarn --frozen-lockfile ;;
            pnpm) corepack enable && pnpm install --frozen-lockfile ;;
          esac

      - name: Show Forge version
        run: forge --version

      - name: Check formatting
        if: inputs.check-formatting
        run: forge fmt --check

      - name: Build contracts
        run: forge build

      - name: Run tests
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
        run: forge test -${{ inputs.test-verbosity }}

  slither:
    name: Slither Analysis
    runs-on: ubuntu-latest
    if: inputs.run-slither
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ inputs.foundry-version }}

      - name: Setup Node.js
        if: inputs.package-manager != 'none'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        if: inputs.package-manager != 'none'
        run: |
          case "${{ inputs.package-manager }}" in
            npm)  npm ci ;;
            yarn) yarn --frozen-lockfile ;;
            pnpm) corepack enable && pnpm install --frozen-lockfile ;;
          esac

      - name: Build for Slither
        run: forge build --build-info --skip '*/test/**' '*/script/**' --force

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          slither-config: ${{ inputs.slither-config }}
          fail-on: ${{ inputs.slither-fail-on }}

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [check]
    if: inputs.run-coverage
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout etherform scripts
        uses: actions/checkout@v4
        with:
          repository: BreadchainCoop/etherform
          ref: ${{ inputs.etherform-ref }}
          path: .etherform
          sparse-checkout: scripts

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ inputs.foundry-version }}

      - name: Setup Node.js
        if: inputs.package-manager != 'none'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        if: inputs.package-manager != 'none'
        run: |
          case "${{ inputs.package-manager }}" in
            npm)  npm ci ;;
            yarn) yarn --frozen-lockfile ;;
            pnpm) corepack enable && pnpm install --frozen-lockfile ;;
          esac

      - name: Show Forge version
        run: forge --version

      - name: Run coverage
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
        run: |
          if [[ -n "${{ inputs.coverage-exclude-paths }}" ]]; then
            forge coverage --no-match-path "${{ inputs.coverage-exclude-paths }}" 2>&1 | tee coverage-raw.txt
          else
            forge coverage 2>&1 | tee coverage-raw.txt
          fi

      - name: Extract summary table
        id: summary
        env:
          COVERAGE_SOURCE_FILTER: ${{ inputs.coverage-source-filter }}
        run: bash .etherform/scripts/coverage/extract-summary.sh

      - name: Post coverage comment
        if: inputs.coverage-post-comment && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: coverage-comment.md

      - name: Check coverage threshold
        if: inputs.coverage-min-threshold > 0
        env:
          THRESHOLD: ${{ inputs.coverage-min-threshold }}
          LINES_PCT: ${{ steps.summary.outputs.lines_pct }}
          STMTS_PCT: ${{ steps.summary.outputs.stmts_pct }}
          BRANCH_PCT: ${{ steps.summary.outputs.branch_pct }}
          FUNCS_PCT: ${{ steps.summary.outputs.funcs_pct }}
        run: bash .etherform/scripts/coverage/check-threshold.sh

  halmos:
    name: Symbolic Execution
    runs-on: ubuntu-latest
    if: inputs.run-halmos
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ inputs.foundry-version }}

      - name: Setup Node.js
        if: inputs.package-manager != 'none'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        if: inputs.package-manager != 'none'
        run: |
          case "${{ inputs.package-manager }}" in
            npm)  npm ci ;;
            yarn) yarn --frozen-lockfile ;;
            pnpm) corepack enable && pnpm install --frozen-lockfile ;;
          esac

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Halmos
        run: pip install halmos

      - name: Run Halmos
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
        run: halmos
