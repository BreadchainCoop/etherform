# Reusable mainnet deployment workflow with matrix support
# Usage: jobs.<job>.uses: ./.github/workflows/_deploy-mainnet.yml
name: Deploy & Verify Mainnet (Reusable)

on:
  workflow_call:
    inputs:
      deploy-script:
        description: 'Path to deployment script'
        type: string
        default: 'script/Deploy.s.sol:Deploy'
      network-config-path:
        description: 'Path to network configuration JSON'
        type: string
        default: '.github/deploy-networks.json'
      network:
        description: 'Specific network to deploy to (leave empty for all mainnets)'
        type: string
        default: ''
      indexing-wait:
        description: 'Seconds to wait for indexer before verification'
        type: number
        default: 60
      verify-contracts:
        description: 'Run Blockscout contract verification after deployment'
        type: boolean
        default: true
      flatten-contracts:
        description: 'Flatten and commit contract snapshots after deploy'
        type: boolean
        default: true
      upgrades-path:
        description: 'Path to store flattened contract snapshots'
        type: string
        default: 'test/upgrades'
      foundry-profile:
        description: 'Foundry profile to use for deployment (leave empty for default)'
        type: string
        default: ''
    secrets:
      PRIVATE_KEY:
        required: true
      RPC_URL:
        required: true
      ADMIN_ADDRESS:
        description: 'Optional admin address for upgradeable contract deploy scripts'
        required: false
      GH_TOKEN:
        description: 'GitHub token for pushing commits (defaults to GITHUB_TOKEN)'
        required: false

jobs:
  read-config:
    name: Read Network Config
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set deployment matrix
        id: set-matrix
        run: |
          if [[ -n "${{ inputs.network }}" ]]; then
            # Filter to specific network if provided
            MATRIX=$(jq -c --arg net "${{ inputs.network }}" '{include: [.mainnets[] | select(.name == $net)]}' ${{ inputs.network-config-path }})
          else
            # All mainnets
            MATRIX=$(jq -c '{include: .mainnets}' ${{ inputs.network-config-path }})
          fi
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [read-config]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.read-config.outputs.matrix) }}
    environment: ${{ matrix.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Validate Foundry profile
        if: inputs.foundry-profile != ''
        run: |
          if ! grep -q "\[profile\.${{ inputs.foundry-profile }}\]" foundry.toml 2>/dev/null; then
            echo "::error::Foundry profile '${{ inputs.foundry-profile }}' not found in foundry.toml"
            exit 1
          fi

      - name: Validate foundry.toml configuration
        run: |
          # Detect etherscan config that references unavailable env vars
          if grep -q 'ETHERSCAN_API_KEY' foundry.toml 2>/dev/null; then
            echo "::warning::foundry.toml references ETHERSCAN_API_KEY which is not available in this workflow. Blockscout is used for verification."
          fi

      - name: Deploy contracts
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          RPC_URL: ${{ secrets.RPC_URL }}
          ADMIN_ADDRESS: ${{ secrets.ADMIN_ADDRESS }}
          FOUNDRY_PROFILE: ${{ inputs.foundry-profile || 'default' }}
        run: |
          # Ensure PRIVATE_KEY has 0x prefix
          if [[ "$PRIVATE_KEY" != 0x* ]]; then
            export PRIVATE_KEY="0x$PRIVATE_KEY"
          fi
          forge script ${{ inputs.deploy-script }} \
            --rpc-url "$RPC_URL" \
            --broadcast \
            --slow \
            -vvvv

      - name: Wait for indexing
        run: sleep ${{ inputs.indexing-wait }}

      - name: Parse deployment addresses
        id: parse
        run: |
          # Find the latest broadcast file
          BROADCAST_FILE=$(find broadcast -name "run-latest.json" -type f | head -1)
          if [[ -z "$BROADCAST_FILE" ]]; then
            echo "No broadcast file found"
            exit 1
          fi
          echo "broadcast_file=$BROADCAST_FILE" >> $GITHUB_OUTPUT

          # Extract deployed contract addresses
          jq -r '.transactions[] | select(.transactionType == "CREATE") | "\(.contractName): \(.contractAddress)"' "$BROADCAST_FILE" | tee deployment-summary.txt

      - name: Verify contracts on Blockscout
        if: inputs.verify-contracts
        env:
          BLOCKSCOUT_URL: ${{ matrix.blockscout_url }}
          RPC_URL: ${{ secrets.RPC_URL }}
        run: |
          BROADCAST_FILE="${{ steps.parse.outputs.broadcast_file }}"

          # Skip if no Blockscout URL configured
          if [[ -z "$BLOCKSCOUT_URL" || "$BLOCKSCOUT_URL" == "null" ]]; then
            echo "::warning::No Blockscout URL configured for ${{ matrix.name }}, skipping verification"
            exit 0
          fi

          # Validate Blockscout URL format
          if ! echo "$BLOCKSCOUT_URL" | grep -qE '^https?://[a-zA-Z0-9.-]+'; then
            echo "::error::Invalid Blockscout URL format: $BLOCKSCOUT_URL"
            exit 1
          fi

          FAILED=0

          # Use process substitution to propagate failures
          while read -r tx; do
            CONTRACT_NAME=$(echo "$tx" | jq -r '.contractName')
            CONTRACT_ADDR=$(echo "$tx" | jq -r '.contractAddress')

            echo "Verifying $CONTRACT_NAME at $CONTRACT_ADDR..."

            VERIFIED=0
            for attempt in 1 2 3; do
              # Capture output and use timeout to prevent hanging
              VERIFY_OUTPUT=$(timeout 120 forge verify-contract "$CONTRACT_ADDR" "$CONTRACT_NAME" \
                --verifier blockscout \
                --verifier-url "${BLOCKSCOUT_URL}/api" \
                --guess-constructor-args \
                --watch 2>&1) || true
              echo "$VERIFY_OUTPUT"

              # Check for actual verification success (not just exit code)
              if echo "$VERIFY_OUTPUT" | grep -qiE "Contract successfully verified|Pass - Verified"; then
                echo "✓ Verified $CONTRACT_NAME"
                VERIFIED=1
                break
              elif echo "$VERIFY_OUTPUT" | grep -qi "Already Verified"; then
                echo "✓ $CONTRACT_NAME already verified"
                VERIFIED=1
                break
              else
                if [[ $attempt -lt 3 ]]; then
                  echo "Attempt $attempt failed, retrying in $((attempt * 30))s..."
                  sleep $((attempt * 30))
                else
                  echo "::warning::Verification failed for $CONTRACT_NAME after 3 attempts"
                  FAILED=1
                fi
              fi
            done
          done < <(jq -c '.transactions[] | select(.transactionType == "CREATE")' "$BROADCAST_FILE")

          if [[ $FAILED -eq 1 ]]; then
            echo "::error::One or more contracts failed verification"
            exit 1
          fi

      - name: Save deployment artifacts
        run: |
          mkdir -p deployments/${{ matrix.name }}
          BROADCAST_FILE="${{ steps.parse.outputs.broadcast_file }}"

          # Extract contracts with proper sourcePathAndName format
          jq '{contracts: [.transactions[] | select(.transactionType == "CREATE") | {sourcePathAndName: "src/\(.contractName).sol:\(.contractName)", address: .contractAddress}]}' "$BROADCAST_FILE" \
            > deployments/${{ matrix.name }}/deployment.json

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ matrix.name }}
          path: deployments/

      - name: Create deployment summary
        env:
          BLOCKSCOUT_URL: ${{ matrix.blockscout_url }}
        run: |
          BROADCAST_FILE="${{ steps.parse.outputs.broadcast_file }}"

          echo "## ${{ matrix.name }} Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Contract | Address | Constructor Args | Explorer |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|---------|------------------|----------|" >> $GITHUB_STEP_SUMMARY

          jq -r '.transactions[] | select(.transactionType == "CREATE") | "\(.contractName)|\(.contractAddress)|\(.arguments // [] | join(", "))"' "$BROADCAST_FILE" | while IFS='|' read -r CONTRACT ADDRESS ARGS; do
            if [[ -n "$BLOCKSCOUT_URL" && "$BLOCKSCOUT_URL" != "null" ]]; then
              EXPLORER="[View](${BLOCKSCOUT_URL}/address/$ADDRESS)"
            else
              EXPLORER="-"
            fi
            echo "| $CONTRACT | \`$ADDRESS\` | ${ARGS:--} | $EXPLORER |" >> $GITHUB_STEP_SUMMARY
          done

          # Method calls section
          CALLS=$(jq -r '.transactions[] | select(.transactionType == "CALL") | "\(.contractName)|\(.function // "unknown")|\(.arguments // [] | join(", "))"' "$BROADCAST_FILE" 2>/dev/null)
          if [[ -n "$CALLS" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details>" >> $GITHUB_STEP_SUMMARY
            echo "<summary>Method Calls</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Contract | Method | Arguments |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|--------|-----------|" >> $GITHUB_STEP_SUMMARY
            echo "$CALLS" | while IFS='|' read -r CONTRACT METHOD ARGS; do
              echo "| $CONTRACT | \`$METHOD\` | ${ARGS:--} |" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi

  flatten-snapshots:
    name: Flatten & Commit Snapshots
    runs-on: ubuntu-latest
    needs: [deploy]
    if: success() && inputs.flatten-contracts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Download all deployment artifacts
        uses: actions/download-artifact@v4
        with:
          path: deployments-downloaded

      - name: Build contracts
        run: forge build
        env:
          FOUNDRY_PROFILE: ${{ inputs.foundry-profile || 'default' }}

      - name: Extract contract list from broadcast artifacts
        id: contracts
        run: |
          # Find all run-latest.json files and extract unique contract source paths
          CONTRACTS=$(find broadcast -name "run-latest.json" -type f -exec \
            jq -r '.transactions[] | select(.transactionType == "CREATE") | "src/\(.contractName).sol"' {} \; 2>/dev/null | sort -u)

          if [[ -z "$CONTRACTS" ]]; then
            echo "No contracts found in broadcast artifacts, falling back to src/*.sol"
            CONTRACTS=$(find src -maxdepth 1 -type f -name "*.sol")
          fi

          echo "Contracts to flatten:"
          echo "$CONTRACTS"
          echo "contracts<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTRACTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Flatten contracts to current snapshot
        env:
          UPGRADES_PATH: ${{ inputs.upgrades-path }}
          FOUNDRY_PROFILE: ${{ inputs.foundry-profile || 'default' }}
        run: |
          mkdir -p "${UPGRADES_PATH}/current"

          echo "${{ steps.contracts.outputs.contracts }}" | while read -r contract; do
            if [[ -f "$contract" ]]; then
              name=$(basename "$contract")
              echo "Flattening $contract..."
              forge flatten "$contract" > "${UPGRADES_PATH}/current/$name"
            fi
          done

          echo "Flattened contracts saved to ${UPGRADES_PATH}/current/"

      - name: Promote snapshots (3-tier rotation)
        env:
          UPGRADES_PATH: ${{ inputs.upgrades-path }}
        run: |
          # Check if baseline exists
          if [[ -d "${UPGRADES_PATH}/baseline" ]] && ls ${UPGRADES_PATH}/baseline/*.sol 1> /dev/null 2>&1; then
            echo "Baseline exists, performing 3-tier rotation..."

            # Step 1: Copy baseline -> previous
            rm -rf "${UPGRADES_PATH}/previous"
            cp -r "${UPGRADES_PATH}/baseline" "${UPGRADES_PATH}/previous"
            echo "✓ Copied baseline to previous"

            # Step 2: Copy current -> baseline
            rm -rf "${UPGRADES_PATH}/baseline"
            cp -r "${UPGRADES_PATH}/current" "${UPGRADES_PATH}/baseline"
            echo "✓ Copied current to baseline"

            COMMIT_MSG="chore: auto-flatten contracts after validation passes [skip ci]"
          else
            echo "No baseline found, initializing baseline from current..."

            # Initialize baseline from current
            mkdir -p "${UPGRADES_PATH}/baseline"
            cp -r "${UPGRADES_PATH}/current/"* "${UPGRADES_PATH}/baseline/"
            echo "✓ Initialized baseline from current"

            COMMIT_MSG="chore: init upgrade baseline [skip ci]"
          fi

          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_ENV

      - name: Commit flattened contracts
        env:
          UPGRADES_PATH: ${{ inputs.upgrades-path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${UPGRADES_PATH}/" || true

          if git diff --staged --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "$commit_msg"
            git push
          fi
